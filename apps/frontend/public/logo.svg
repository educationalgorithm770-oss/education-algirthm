<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4F46E5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Squircle with Subtle Radius matching Website UI (rounded-xl / rounded-2xl) -->
  <rect x="24" y="24" width="464" height="464" rx="128" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="26" y="26" width="460" height="460" rx="126" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />

  <!-- Official FontAwesome Solid Graduation Cap Geometry -->
  <!-- Mortarboard Diamond Cap -->
  <path d="M 256 120 L 448 208 L 256 296 L 64 208 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />
  
  <!-- Under-Cap Skullcap / Crown Base -->
  <path d="M 144 248 L 144 332 C 144 380 368 380 368 332 L 368 248 C 336 268 296 280 256 280 C 216 280 176 268 144 248 Z" fill="#FFFFFF" />

  <!-- Right Tassel & Ribbon -->
  <!-- Tassel Cord -->
  <path d="M 416 230 L 416 350" stroke="#FBBF24" stroke-width="14" stroke-linecap="round" />
  
  <!-- Tassel Button on top -->
  <circle cx="256" cy="208" r="14" fill="#FBBF24" />
  
  <!-- Tassel Hanging Fringe -->
  <ellipse cx="416" cy="360" rx="16" ry="24" fill="#FBBF24" />
</svg>
