        rootCause: "Does not track failed attempts in password_resets table.",
        impact: "Increases exposure to automated 6-digit OTP guessing attacks.",
        remediation: "Lock out and delete reset token after 5 failed attempts."
      }
    ];

    let currentSeverity = 'ALL';

    function renderVulnerabilities(items) {
      const container = document.getElementById('vulnList');
      if (items.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-slate-500 rounded-2xl bg-slate-900 border border-slate-800">No matching vulnerabilities found.</div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const isP0 = item.severity === 'P0';
        const isP1 = item.severity === 'P1';

        const badgeClass = isP0 
          ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
          : isP1 
          ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
          : 'bg-blue-500/10 text-blue-400 border border-blue-500/20';

        const borderClass = isP0 
          ? 'hover:border-rose-500/40' 
          : isP1 
          ? 'hover:border-amber-500/40' 
          : 'hover:border-blue-500/40';

        return `
          <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5 ${borderClass} transition-all">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-md text-xs font-black tracking-wider ${badgeClass}">
                  ${item.severity}
                </span>
                <span class="text-xs font-mono text-slate-500">${item.id}</span>
                <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300 font-medium">${item.category}</span>
              </div>
              <span class="text-xs font-mono text-slate-400 bg-slate-950 px-2.5 py-1 rounded border border-slate-800">
                ${item.file}
              </span>
            </div>

            <h3 class="text-base font-bold text-white mb-2">${item.title}</h3>
            <p class="text-xs text-slate-300 mb-4 leading-relaxed">${item.summary}</p>

            <div class="flex flex-wrap gap-1.5 mb-4">
              ${item.endpoints.map(ep => `<span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-950 border border-slate-800 text-emerald-400">${ep}</span>`).join('')}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-3 border-t border-slate-800/80 text-xs">
              <div class="p-3 rounded-xl bg-slate-950/70 border border-slate-800">
                <div class="font-bold text-rose-400 mb-1">Root Cause</div>
                <div class="text-slate-400">${item.rootCause}</div>
              </div>
              <div class="p-3 rounded-xl bg-slate-950/70 border border-slate-800">
                <div class="font-bold text-amber-400 mb-1">Security Impact</div>
                <div class="text-slate-400">${item.impact}</div>
              </div>
            </div>

            <div class="mt-3 p-3 rounded-xl bg-emerald-950/20 border border-emerald-900/30 text-xs text-emerald-300">
              <span class="font-bold text-emerald-400">🛡️ Recommended Fix:</span> ${item.remediation}
            </div>
          </div>
        `;
      }).join('');
    }

    function setSeverity(sev) {
      currentSeverity = sev;
      document.querySelectorAll('.sev-btn').forEach(btn => {
        if (btn.dataset.sev === sev) {
          btn.className = 'sev-btn active px-3 py-1 rounded-lg text-xs font-semibold bg-slate-200 text-slate-900 shadow-sm transition-all';
        } else {
          btn.className = 'sev-btn px-3 py-1 rounded-lg text-xs font-semibold bg-slate-800 text-slate-400 hover:text-white transition-all';
        }
      });
      filterVulnerabilities();
    }

    function filterVulnerabilities() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = VULNS.filter(item => {
        const matchSev = currentSeverity === 'ALL' || item.severity === currentSeverity;
        const matchQuery = 
          item.title.toLowerCase().includes(q) ||
          item.file.toLowerCase().includes(q) ||
          item.summary.toLowerCase().includes(q) ||
          item.endpoints.some(e => e.toLowerCase().includes(q));
        return matchSev && matchQuery;
      });
      renderVulnerabilities(filtered);
    }

    // Initialize
    renderVulnerabilities(VULNS);
  </script>
</body>
</html>
